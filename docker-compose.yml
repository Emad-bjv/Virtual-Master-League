version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: vml_db
      POSTGRES_USER: vml_user
      POSTGRES_PASSWORD: vml_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
